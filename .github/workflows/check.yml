# Submission check on every push (logic lives in the template repository)
name: check

on:
  push:
    paths: [my_bigint.c]
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # skip the template itself, and the initial commit of a new group repository
    # (created from the template by the join bot: untouched starter, nothing to check yet)
    if: >-
      github.repository != 'course-PC/bigint-challenge' &&
      !(github.event_name == 'push' && github.event.created && github.run_number == 1)
    uses: course-PC/bigint-challenge/.github/workflows/check-reusable.yml@main
