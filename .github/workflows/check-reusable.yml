# Submission check: header, rules, build, small correctness tests (no timing)
name: check-reusable

on:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout submission
        uses: actions/checkout@v5
        with:
          path: submission

      - name: Checkout original harness
        uses: actions/checkout@v5
        with:
          repository: course-PC/bigint-challenge
          path: harness

      - name: Install GMP
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libgmp-dev

      - name: Check submission
        run: python3 harness/.github/scripts/check_submission.py submission harness build
